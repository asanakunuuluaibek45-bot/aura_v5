<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#29233d">
  <title>Gold Uchet — Офлайн</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --page-bg: #1c1830;
      --card-bg: #29233d;
      --text: #f3f1f7;
      --muted: #b2acbf;
      --accent: #c9a227;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #fbfaff;
      --card-bg: #ffffff;
      --text: #302d3d;
      --muted: #696579;
      --accent: #7055d9;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: rgba(201, 162, 39, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9a227;
    }
    .icon-box svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #c9a227;
      color: #121417;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .pulse-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9a227;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --page-bg: #fbfaff;
        --card-bg: #ffffff;
        --text: #302d3d;
        --muted: #696579;
        --accent: #7055d9;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Нет подключения к сети</h1>
    <p>Если вы уже входили в GOLDUCHET и загружали каталог, откройте кассу повторно. Для первого запуска и загрузки товаров потребуется интернет.</p>
    <button class="btn" onclick="retryConnection()">Повторить попытку</button>
    <div class="status">
      <span class="pulse-dot"></span>Автоматическое переподключение при появлении сети
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://golduchet.com';
    try {
      const savedTheme = localStorage.getItem('aura-theme');
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content',
        theme === 'dark' ? '#29233d' : '#fbfaff'
      );
    } catch {}
    function retryConnection() {
      window.location.href = TARGET_URL;
    }

    window.addEventListener('online', () => {
      retryConnection();
    });

    setInterval(() => {
      if (navigator.onLine) {
        fetch(TARGET_URL + '/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
          .then(() => { retryConnection(); })
          .catch(() => {});
      }
    }, 3000);
  </script>
</body>
</html>
