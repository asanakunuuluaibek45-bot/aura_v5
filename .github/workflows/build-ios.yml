name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add or Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Set iOS Permissions in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Требуется для сканирования QR-кодов и штрихкодов товаров'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Требуется для подключения к Bluetooth-термопринтеру Niimbot'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Требуется для подключения к Bluetooth-термопринтеру Niimbot'" "$PLIST" || true
          fi

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app Payload/
          zip -r aura-crm-ios.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-crm-ios-ipa
          path: aura-crm-ios.ipa
          retention-days: 7
